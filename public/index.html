<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaldeas</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1><a href="/" class="header-link"><img src="/favicon.png" class="header-icon" alt=""></a></h1>
    <nav>
      <a href="/" class="active">上传图片</a>
      <a href="/manage.html">图片管理</a>
    </nav>
  </header>

  <main>
    <div class="upload-container">
      <div class="drop-zone" id="dropZone">
        <p class="drop-zone-icon">📁</p>
        <p class="drop-zone-text">拖拽图片到此处，或 <span class="browse-link">点击浏览</span></p>
        <p class="drop-zone-hint">支持 JPG / PNG / GIF / WebP / SVG / BMP / TIFF，最大 10MB</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <div class="preview" id="preview" hidden>
        <div class="preview-image-wrapper">
          <img id="previewImage" src="" alt="预览">
        </div>
        <div class="preview-info">
          <span id="previewName"></span>
          <span id="previewSize"></span>
        </div>
        <div class="progress-bar" id="progressBar" hidden>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <button class="btn btn-upload" id="uploadBtn">开始上传</button>
        <button class="btn btn-reset" id="reselectBtn" style="margin-top:8px">重新选择</button>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-image-wrapper">
          <img id="resultImage" src="" alt="上传结果">
        </div>
        <div class="result-url">
          <label for="urlInput">图片链接</label>
          <div class="url-input-group">
            <input type="text" id="urlInput" readonly>
            <button class="btn btn-copy" id="copyUrlBtn">📋 复制链接</button>
          </div>
          <div class="url-actions">
            <button class="btn btn-copy" id="copyMarkdownBtn">复制 Markdown</button>
            <button class="btn btn-copy" id="copyHtmlBtn">复制 HTML</button>
          </div>
        </div>
        <button class="btn btn-reset" id="resetBtn">继续上传</button>
      </div>
    </div>
  </main>

  <script src="/js/upload.js"></script>
</body>
</html>
