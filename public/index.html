<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaldeas</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1><a href="/" class="header-link"><img src="/favicon.png" class="header-icon" alt=""></a></h1>
    <nav>
      <a href="/" class="active">上传图片</a>
      <a href="/manage.html">图片管理</a>
    </nav>
  </header>

  <main>
    <div class="upload-container">
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" focusable="false">
            <path d="M22 46H18a12 12 0 0 1-1.8-23.9A17 17 0 0 1 48.6 25 10.5 10.5 0 0 1 47 46h-5" />
            <path d="M32 46V27" />
            <path d="M24 35l8-8 8 8" />
          </svg>
        </div>
        <p class="drop-zone-text">拖拽一张或多张图片到此处，或 <span class="browse-link">点击浏览</span></p>
        <p class="drop-zone-hint">支持 JPG / PNG / GIF / WebP / SVG / BMP / TIFF，单张最大 50MB</p>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>

      <div class="preview" id="preview" hidden>
        <div class="preview-summary">
          <strong id="previewName"></strong>
          <span id="previewSize"></span>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
        <div class="progress-bar" id="progressBar" hidden>
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <button class="btn btn-upload" id="uploadBtn">开始上传</button>
        <button class="btn btn-reset" id="reselectBtn">重新选择</button>
      </div>

      <div class="result" id="result" hidden>
        <div class="result-header">
          <strong id="resultTitle">上传完成</strong>
          <span id="resultCount"></span>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="url-actions batch-actions">
          <button class="btn btn-copy" id="copyUrlBtn">复制全部链接</button>
          <button class="btn btn-copy" id="copyMarkdownBtn">复制全部 Markdown</button>
          <button class="btn btn-copy" id="copyHtmlBtn">复制全部 HTML</button>
        </div>
        <button class="btn btn-reset" id="resetBtn">继续上传</button>
      </div>
    </div>
  </main>

  <script src="/js/upload.js"></script>
</body>
</html>
